name: Build EXE

permissions:
  contents: read

on:
  push:
    branches:
      - main
  workflow_dispatch:
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Build
        shell: cmd
        run: build.bat

      - name: Upload artifact (PRs)
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: relayout-pr-${{ github.event.pull_request.number }}
          path: relayout.exe
          if-no-files-found: error

      - name: Publish release
        if: github.event_name != 'pull_request'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $sha = $env:GITHUB_SHA
          $tag = "build-$($sha.Substring(0,7))"
          Write-Host "Tag: $tag  SHA: $sha"

          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
              gh release delete $tag --yes --cleanup-tag
          }

          gh release create $tag `
              --title $tag `
              --notes "Automated build of commit $sha" `
              --target $sha `
              --prerelease
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          gh release upload $tag relayout.exe --clobber
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
